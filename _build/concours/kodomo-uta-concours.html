<title>歌のコンクールさがし</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: same calm tool as the classroom search — filters at left (top on phones), contest cards with a status pill and a date strip on the right. */
:root{
  --bg:#f6f7fb; --surface:#ffffff; --ink:#1d2340; --muted:#5d6482; --line:#dfe3ef;
  --accent:#2f56c9; --accent-soft:#e7edfc; --open:#2c7a4b; --open-soft:#e3f3e9; --soon:#9a6a00; --soon-soft:#fbf1d9; --closed:#7a7f96; --closed-soft:#eceef4; --note:#b4541b; --note-soft:#fbeee4;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
  --body:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12152a; --surface:#1b1f38; --ink:#e9ebf7; --muted:#a3a9c6; --line:#2e3354; --accent:#8fa8ff; --accent-soft:#252d55;
  --open:#7dd3a0; --open-soft:#1f3a2c; --soon:#f0c96a; --soon-soft:#3a3120; --closed:#9aa0bb; --closed-soft:#262a44; --note:#f0a372; --note-soft:#3a2a22; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12152a; --surface:#1b1f38; --ink:#e9ebf7; --muted:#a3a9c6; --line:#2e3354; --accent:#8fa8ff; --accent-soft:#252d55;
  --open:#7dd3a0; --open-soft:#1f3a2c; --soon:#f0c96a; --soon-soft:#3a3120; --closed:#9aa0bb; --closed-soft:#262a44; --note:#f0a372; --note-soft:#3a2a22; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px}
header h1{font-family:var(--display);font-weight:700;font-size:clamp(24px,4.4vw,34px);margin:0 0 6px;text-wrap:balance}
header p{margin:0;color:var(--muted);max-width:64ch}
.layout{display:grid;grid-template-columns:300px 1fr;gap:28px;margin-top:26px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:18px}
@media (min-width:821px){.panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}}
.field{display:flex;flex-direction:column;gap:8px}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
input[type=search],select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.reset{font:inherit;font-size:13px;background:none;border:none;color:var(--accent);cursor:pointer;padding:0;text-align:left;text-decoration:underline}
.head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.count{font-family:var(--display);font-size:20px;font-weight:700}
.count small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:400;margin-left:6px}
.sort{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.sort select{width:auto;padding:6px 10px}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 14px;min-width:0}
@media (max-width:560px){.card{grid-template-columns:1fr}}
.card h4{margin:0;font-size:16px;font-weight:700;overflow-wrap:anywhere}
.sub{font-size:13px;color:var(--muted);margin:0}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;align-self:start;justify-self:end}
@media (max-width:560px){.pill{justify-self:start;grid-row:1}}
.pill.open{background:var(--open-soft);color:var(--open)}
.pill.soon{background:var(--soon-soft);color:var(--soon)}
.pill.closed{background:var(--closed-soft);color:var(--closed)}
.pill.tbd{background:var(--note-soft);color:var(--note)}
.facts{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 16px;font-size:13px;margin:4px 0 0;padding:0}
.facts div{display:flex;gap:6px;min-width:0}
.facts dt{color:var(--muted);white-space:nowrap}
.facts dd{margin:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.tags{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.tag.age{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.warn{grid-column:1/-1;font-size:12px;color:var(--note);margin:0}
.links{grid-column:1/-1;font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;color:var(--muted)}
.links a{color:var(--accent);font-weight:500}
.mine{border-color:var(--accent)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:22px;color:var(--muted)}
footer{margin-top:40px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:18px;display:grid;gap:6px;max-width:72ch}
</style>

<div class="wrap">
  <header>
    <h1>歌のコンクールさがし</h1>
    <p>子どもから大人・シニアまで出られる、歌・声楽・童謡のコンクールを、年れい・地域・しめきりでさがせます。日程は2026年11月時点の公式情報です。お申し込みは、各大会の公式サイトから行ってください。</p>
  </header>
  <div class="layout">
    <aside class="panel" aria-label="さがす条件">
      <div class="field"><label class="label" for="q">キーワード</label><input id="q" type="search" placeholder="大会名・地域など"></div>
      <div class="field"><span class="label">出る人の年れい</span><div class="chips" id="ages"></div></div>
      <div class="field"><span class="label">ジャンル</span><div class="chips" id="genres"></div></div>
      <div class="field"><label class="label" for="region">会場の地域</label><select id="region"><option value="">すべて</option></select></div>
      <div class="field"><span class="label">出かた</span><div class="chips" id="methods"></div></div>
      <div class="field"><span class="label">受付の状況</span><div class="chips" id="status"></div></div>
      <div class="field"><label class="label" for="within">しめきりまで</label><select id="within"><option value="">指定しない</option><option value="7">7日以内</option><option value="30">30日以内</option><option value="90">90日以内</option></select></div>
      <button class="reset" id="reset" type="button">条件をクリア</button>
    </aside>
    <main>
      <div class="head">
        <div class="count" id="count" aria-live="polite"></div>
        <label class="sort" for="sort">ならび順<select id="sort"><option value="deadline">しめきりが近い順</option><option value="event">開催日が近い順</option><option value="fee">参加費が安い順</option></select></label>
      </div>
      <div class="list" id="list"></div>
    </main>
  </div>
  <footer>
    <div>受付の状況は、のっている日程から自動で表示しています。定員などで早く受付が終わることもあります。</div>
    <div>同じ大会でも、地区や部門でしめきり・参加費がちがうことがあります。かならず公式サイトでご確認ください。</div>
    <div>まちがいや掲載のご希望は、こどもの歌声グランプリのお問い合わせからお知らせください。</div>
  </footer>
</div>
