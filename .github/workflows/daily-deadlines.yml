# 毎日 日本時間 0:10 に、しめきりカレンダー・一覧ページ・要項ボックスを作りなおす（過ぎたしめきりを消す）
name: daily-deadlines
on:
  schedule:
    - cron: '10 15 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python3 _build/region_contests.py
          python3 _build/deadline_page.py
          python3 _build/contest_pages.py
          python3 _build/feed.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Daily deadline refresh" && git pull --rebase -X theirs origin main && git push)
      - if: always()
        run: python3 _build/indexnow.py ${{ github.event_name == 'workflow_dispatch' && '400' || '2' }}
